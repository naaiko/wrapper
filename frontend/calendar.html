<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/calendar.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="overflow-hidden">
    <div class="min-h-screen bg-base-200">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-lg">
            <div class="flex-1">
                <a href="projects.html" class="btn btn-ghost text-xl">Continuity Manager</a>
            </div>
            <div class="flex-none gap-2">
                <a href="timeline.html" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    Timeline
                </a>
                <a href="projects.html" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Projects
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col h-[calc(100vh-4rem)]">
            <!-- Calendar Header -->
            <div class="flex justify-between items-center py-4 px-6 bg-base-100">
                <div class="flex items-center gap-4">
                    <button id="prevMonth" class="btn btn-ghost btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <h2 class="text-2xl font-bold" id="calendarTitle">December 2025</h2>
                    <button id="nextMonth" class="btn btn-ghost btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <button id="todayBtn" class="btn btn-sm">Today</button>
                </div>
                
                <div class="text-sm text-base-content/70">
                    Drag scenes from the side panel onto calendar days
                </div>
            </div>

            <div class="flex flex-1 overflow-hidden">
                <!-- Scene Library (Left Sidebar) -->
                <div class="w-80 bg-base-100 border-r border-base-300 overflow-y-auto p-4">
                    <h3 class="font-bold mb-4 flex items-center justify-between">
                        <span>Unscheduled Scenes</span>
                        <button id="addSceneFromCalendar" class="btn btn-primary btn-xs btn-circle">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </h3>
                    <div id="unscheduledScenes" class="space-y-2">
                        <!-- Unscheduled scenes will be rendered here -->
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="flex-1 overflow-auto p-6">
                    <div id="calendarGrid" class="calendar-grid">
                        <!-- Calendar will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Dock (Actions) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="flex gap-2 bg-base-100 p-3 rounded-box shadow-xl">
                <button id="addSceneBtn" class="btn btn-square btn-primary" title="Add Scene">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Scene Modal -->
    <dialog id="addSceneModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Add New Scene</h3>
            <form id="addSceneForm">
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Scene Number</span>
                    </label>
                    <input 
                        type="text" 
                        id="sceneNumber" 
                        class="input input-bordered" 
                        placeholder="e.g., 1, 2A, 15B" 
                        required 
                    />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Description</span>
                    </label>
                    <input 
                        type="text" 
                        id="sceneDescription" 
                        class="input input-bordered" 
                        placeholder="e.g., INT. COFFEE SHOP - DAY" 
                        required 
                    />
                </div>
                
                <div class="modal-action">
                    <button type="button" class="btn" id="cancelSceneBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Scene</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script type="module" src="js/calendar.js"></script>
</body>
</html>
