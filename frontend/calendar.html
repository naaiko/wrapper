<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Toast UI Calendar CSS -->
    <link rel="stylesheet" href="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.css" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/calendar-toastui.css">
    <link rel="stylesheet" href="css/hatched-backgrounds.css">
    <link rel="stylesheet" href="css/edit-screen.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Toast UI Calendar -->
    <script src="https://uicdn.toast.com/calendar/latest/toastui-calendar.min.js"></script>
    
    <!-- Cally Date Picker -->
    <script type="module" src="https://unpkg.com/cally"></script>
</head>
<body class="overflow-hidden">
    <div class="min-h-screen bg-base-200">
        <!-- Navigation (Top Right) -->
        <div class="fixed top-4 right-4 z-50" id="topNavigation">
            <!-- Navigation will be injected here by navigation.js -->
        </div>

        <!-- Main Content -->
        <div class="flex flex-col h-screen">
            <!-- Calendar Header -->
            <div class="flex justify-between items-center pt-20 pb-4 px-6 bg-base-200">
                <div class="flex items-center gap-4">
                    <button id="prevMonth" class="btn btn-ghost btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <h2 class="text-2xl font-bold w-64 text-center" id="calendarTitle">December 2025</h2>
                    <button id="nextMonth" class="btn btn-ghost btn-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                    <button id="todayBtn" class="btn btn-sm">Today</button>
                </div>
                
                <div class="text-sm text-base-content/70">
                    Drag scenes from the side panel onto calendar days
                </div>
            </div>

            <div class="flex flex-1 overflow-hidden relative">
                <!-- Scene Library (Left Sidebar) - Darker background -->
                <div class="w-96 bg-base-200 overflow-y-auto p-4">
                    <h3 class="font-bold mb-4 flex items-center justify-between">
                        <span>Unscheduled Scenes</span>
                        <button id="addSceneFromCalendar" class="btn btn-primary btn-xs btn-circle">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </h3>
                    <div id="unscheduledScenes" class="space-y-2">
                        <!-- Unscheduled scenes will be rendered here -->
                    </div>
                </div>

                <!-- Rounded corner transition -->
                <div class="absolute top-0 left-96 w-8 h-8 bg-base-200 pointer-events-none" style="border-bottom-right-radius: 2rem;"></div>
                <div class="absolute top-0 left-96 w-8 h-8 bg-base-100 pointer-events-none" style="border-top-left-radius: 2rem;"></div>

                <!-- Calendar Grid - Lighter background -->
                <div class="flex-1 overflow-hidden p-6 flex flex-col bg-base-100">
                    <div id="calendar" class="flex-1" style="height: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Settings Backdrop -->
        <div id="settingsBackdrop" class="fixed inset-0 bg-black/50 opacity-0 pointer-events-none transition-opacity duration-300 z-40"></div>

        <!-- Settings Subdock (Above Main Dock) -->
        <div id="settingsSubdock" class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-all duration-300">
            <div class="bg-base-100 p-4 rounded-box shadow-xl w-[600px]">
                <!-- Tabs -->
                <div role="tablist" class="tabs tabs-boxed mb-4">
                    <button role="tab" class="tab tab-active" data-tab="scene-headings">Scene Headings</button>
                    <button role="tab" class="tab" data-tab="time-settings">Time of Day</button>
                    <button role="tab" class="tab" data-tab="conditions-settings">Conditions</button>
                </div>

                <!-- Tab Content Container -->
                <div id="settingsTabContent" class="h-[600px]">
                    <!-- Tab contents will be inserted here -->
                </div>
            </div>
        </div>

        <!-- Bottom Dock (Actions) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="flex gap-2 bg-base-100 p-3 rounded-box shadow-xl">
                <button id="addSceneBtn" class="btn btn-square btn-primary" title="Add Scene">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
                <button id="locationsConfigBtn" class="btn btn-square" title="Locations Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                <button id="settingsBtn" class="btn btn-square" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Scene Screen is now dynamically created by AddSceneScreen component -->

    <!-- Scene edit screen is now dynamically created by SceneEditScreen component -->

    <!-- Tab Content Templates (Hidden) -->
    <template id="sceneHeadingsTabTemplate">
        <div class="flex flex-col h-full">
            <!-- Scrollable Content -->
            <div class="flex-1 overflow-y-auto space-y-4 pr-2">
                <p class="text-sm text-base-content/70">
                    Configure which components should be included in scene headings
                </p>
                
                <!-- Feature Toggles -->
                <div class="space-y-3">
                    <div class="form-control">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="settingShowIntExt" class="toggle toggle-primary" checked />
                            <div>
                                <span class="label-text font-semibold">INT./EXT. (Interior/Exterior)</span>
                                <p class="text-xs text-base-content/60">Show interior/exterior designation</p>
                            </div>
                        </label>
                    </div>
                    
                    <div class="form-control">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="settingShowLocation" class="toggle toggle-primary" checked />
                            <div>
                                <span class="label-text font-semibold">Location</span>
                                <p class="text-xs text-base-content/60">Show location/setting name</p>
                            </div>
                        </label>
                    </div>
                    
                    <div class="form-control">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="settingShowTime" class="toggle toggle-primary" checked />
                            <div>
                                <span class="label-text font-semibold">Time of Day</span>
                                <p class="text-xs text-base-content/60">Show time designation (DAY, NIGHT, etc.)</p>
                            </div>
                        </label>
                    </div>
                    
                    <div class="form-control">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="settingShowConditions" class="toggle toggle-primary" checked />
                            <div>
                                <span class="label-text font-semibold">Conditions</span>
                                <p class="text-xs text-base-content/60">Show weather/environmental conditions</p>
                            </div>
                        </label>
                    </div>
                    
                    <div class="form-control">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="settingShowContinuity" class="toggle toggle-primary" checked />
                            <div>
                                <span class="label-text font-semibold">Continuity</span>
                                <p class="text-xs text-base-content/60">Show continuity designation (CONTINUOUS, LATER, etc.)</p>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Fixed Footer -->
            <div class="pt-4 border-t border-base-300 mt-4">
                <!-- Example -->
                <div class="bg-base-200 p-4 rounded-lg mb-4">
                    <div class="text-sm font-semibold mb-2">Preview:</div>
                    <div id="settingsPreview" class="font-mono text-sm">
                        INT. COFFEE SHOP - DAY - CONTINUOUS
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex justify-end">
                    <button type="button" class="btn btn-sm" id="closeSubdockBtn">Close</button>
                </div>
            </div>
        </div>
    </template>

    <template id="timeSettingsTabTemplate">
        <div class="flex flex-col h-full">
            <!-- Scrollable List -->
            <div class="flex-1 overflow-y-auto pr-2">
                <h4 class="font-semibold mb-2">Available Times</h4>
                <div id="timesList" class="space-y-2">
                    <!-- Time items will be rendered here -->
                </div>
            </div>

            <!-- Fixed Footer -->
            <div class="pt-4 border-t border-base-300 mt-4">
                <div class="text-sm font-semibold mb-2">Add New Time</div>
                <form id="addTimeForm">
                    <div class="flex gap-2">
                        <!-- Icon Picker Button (Round) -->
                        <button type="button" id="chooseIconBtn" class="btn btn-circle btn-sm border border-base-300 bg-base-100 hover:bg-base-200" title="Choose icon">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-base-content/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="selectedIconSvg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </button>
                        
                        <!-- Label Input (Fills remaining space) -->
                        <input 
                            type="text" 
                            id="newTimeLabel" 
                            class="input input-bordered input-sm flex-1" 
                            placeholder="e.g., Afternoon"
                            required
                        />
                        
                        <!-- Add Button -->
                        <button type="submit" class="btn btn-primary btn-sm">
                            Add
                        </button>
                        
                        <input type="hidden" id="newTimeIcon" required />
                    </div>
                </form>
                
                <!-- Preview -->
                <div class="bg-base-200 p-4 rounded-lg mt-4">
                    <div class="text-sm font-semibold mb-3">Preview - How it appears on scene cards:</div>
                    <div id="timePreview">
                        <!-- Scene card will be rendered here by JavaScript -->
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex justify-end mt-4">
                    <button type="button" class="btn btn-sm" id="closeSubdockBtn">Close</button>
                </div>
            </div>
        </div>
    </template>

    <template id="conditionsSettingsTabTemplate">
        <div class="flex flex-col h-full">
            <!-- Scrollable List -->
            <div class="flex-1 overflow-y-auto pr-2">
                <h4 class="font-semibold mb-2">Available Conditions</h4>
                <div id="conditionsList" class="space-y-2">
                    <!-- Condition items will be rendered here -->
                </div>
            </div>

            <!-- Fixed Footer -->
            <div class="pt-4 border-t border-base-300 mt-4">
                <div class="text-sm font-semibold mb-2">Add New Condition</div>
                <form id="addConditionForm">
                    <div class="flex gap-2">
                        <!-- Icon Picker Button (Round) -->
                        <button type="button" id="chooseConditionIconBtn" class="btn btn-circle btn-sm border border-base-300 bg-base-100 hover:bg-base-200" title="Choose icon">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-base-content/70" fill="none" viewBox="0 0 24 24" stroke="currentColor" id="selectedConditionIconSvg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                        </button>
                        
                        <!-- Label Input (Fills remaining space) -->
                        <input 
                            type="text" 
                            id="newConditionLabel" 
                            class="input input-bordered input-sm flex-1" 
                            placeholder="e.g., Foggy"
                            required
                        />
                        
                        <!-- Add Button -->
                        <button type="submit" class="btn btn-primary btn-sm">
                            Add
                        </button>
                        
                        <input type="hidden" id="newConditionIcon" required />
                    </div>
                </form>
                
                <!-- Preview -->
                <div class="bg-base-200 p-4 rounded-lg mt-4">
                    <div class="text-sm font-semibold mb-3">Preview - How it appears on scene cards:</div>
                    <div id="conditionsPreview">
                        <!-- Scene card will be rendered here by JavaScript -->
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="flex justify-end mt-4">
                    <button type="button" class="btn btn-sm" id="closeSubdockBtn">Close</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Locations Configuration Modal -->
    <dialog id="locationsConfigModal" class="modal">
        <div class="modal-box max-w-2xl">
            <h3 class="font-bold text-lg mb-4">Locations Settings</h3>
            
            <div class="space-y-4">
                <!-- Existing Locations -->
                <div>
                    <h4 class="font-semibold mb-2">Available Locations</h4>
                    <div id="locationsList" class="space-y-2">
                        <!-- Location items will be rendered here -->
                    </div>
                </div>

                <!-- Add New Location -->
                <div class="divider">Add New Location</div>
                <form id="addLocationForm">
                    <div class="flex gap-2">
                        <!-- Location Name Input -->
                        <input 
                            type="text" 
                            id="newLocationName" 
                            class="input input-bordered flex-1" 
                            placeholder="e.g., COFFEE SHOP, CITY STREET, PARK"
                            required
                        />
                        
                        <!-- Add Button -->
                        <button type="submit" class="btn btn-primary">
                            Add
                        </button>
                    </div>
                </form>
            </div>
            
            <div class="modal-action">
                <button type="button" class="btn" id="closeLocationsConfigBtn">Close</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Non-Shooting Day Toggle Modal -->
    <dialog id="nonShootingDayModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Non-Shooting Day</h3>
            <p class="mb-4" id="nonShootingDayDate"></p>
            
            <div class="form-control">
                <label class="label cursor-pointer justify-start gap-4">
                    <input type="checkbox" id="nonShootingDayToggle" class="toggle toggle-primary" />
                    <span class="label-text">Mark as non-shooting day</span>
                </label>
            </div>
            
            <div class="modal-action">
                <button type="button" class="btn" id="closeNonShootingDayBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveNonShootingDayBtn">Save</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Split Scene Modal -->
    <dialog id="splitSceneModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">⚠️ Non-Shooting Day in Range</h3>
            <p class="mb-4" id="splitSceneMessage"></p>
            <p class="text-sm text-base-content/70 mb-4">Do you want to split this scene into two separate scenes?</p>
            
            <div class="bg-base-200 p-3 rounded-lg mb-4">
                <div class="text-sm font-semibold mb-2">Result:</div>
                <div id="splitScenePreview" class="text-sm space-y-1"></div>
            </div>
            
            <div class="modal-action">
                <button type="button" class="btn" id="cancelSplitBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="confirmSplitBtn">Split Scene</button>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script type="module">
        import { createNavigation } from './js/components/navigation.js';
        
        // Initialize navigation
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        if (projectId) {
            createNavigation(projectId, 'calendar');
        }
    </script>
    <script type="module" src="js/calendar-toastui.js"></script>
</body>
</html>
