<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- Hatched Pattern (Diagonal Lines) -->
    <pattern id="hatched" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="var(--pattern-bg, white)"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="var(--pattern-stroke, black)" stroke-width="1"/>
    </pattern>

    <!-- Hatched Reverse Pattern (Diagonal Lines -45deg) -->
    <pattern id="hatched-reverse" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(-45)">
      <rect width="12" height="12" fill="var(--pattern-bg, white)"/>
      <line x1="6" y1="0" x2="6" y2="12" stroke="var(--pattern-stroke, black)" stroke-width="1"/>
    </pattern>

    <!-- Crosshatch Pattern -->
    <pattern id="crosshatch" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="var(--pattern-bg, white)"/>
      <line x1="0" y1="0" x2="12" y2="12" stroke="var(--pattern-stroke, black)" stroke-width="1"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="var(--pattern-stroke, black)" stroke-width="1"/>
    </pattern>

    <!-- Dots Pattern -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="var(--pattern-bg, white)"/>
      <circle cx="5" cy="5" r="1.5" fill="var(--pattern-dot, black)"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="grid" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="var(--pattern-bg, white)"/>
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="var(--pattern-stroke, black)" stroke-width="1"/>
    </pattern>
  </defs>
</svg>
