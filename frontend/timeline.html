<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Intro.js for Onboarding -->
    <link href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/minified/introjs.min.css" rel="stylesheet" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/intro-custom.css">
    <link rel="stylesheet" href="css/edit-screen.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="overflow-hidden">
    <div class="min-h-screen bg-base-200">
        <!-- Navigation (Top Right) -->
        <div class="fixed top-4 right-4 z-50" id="topNavigation">
            <!-- Navigation will be injected here by navigation.js -->
        </div>

        <!-- Main Content -->
        <div class="flex flex-col h-screen">
            <!-- Timeline Container (Full Viewport) -->
            <div class="flex-1 px-4 pt-20">
                <!-- Horizontal Scrollable Timeline -->
                <div id="sceneContainer" class="flex items-center overflow-x-auto gap-4 pb-4 h-full scrollbar-hide">
                    <!-- Scenes will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Bottom Dock (Actions) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="flex gap-3 bg-base-100 p-3 rounded-box shadow-xl items-center">
                <!-- Mode Toggle (Compact) -->
                <div class="btn-group btn-group-sm">
                    <button 
                        id="btnStoryOrder" 
                        class="btn btn-sm btn-active"
                        onclick="switchMode('story')"
                        title="Story Order"
                    >
                        Story
                    </button>
                    <button 
                        id="btnShootingOrder" 
                        class="btn btn-sm"
                        onclick="switchMode('shooting')"
                        title="Shooting Order"
                    >
                        Shooting
                    </button>
                </div>
                
                <!-- Divider -->
                <div class="divider divider-horizontal mx-0"></div>
                
                <!-- Add Scene Button -->
                <button id="addSceneBtn" class="btn btn-square btn-primary btn-sm" title="Add Scene">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Scene Screen is now dynamically created by AddSceneScreen component -->

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script type="module">
        import { createNavigation } from './js/components/navigation.js';
        
        // Initialize navigation
        const urlParams = new URLSearchParams(window.location.search);
        let projectId = urlParams.get('project');
        
        // Fallback to localStorage if no project in URL
        if (!projectId) {
            projectId = localStorage.getItem('continuityManager_currentProject');
            if (projectId) {
                // Update URL with project ID
                window.history.replaceState({}, '', `?project=${projectId}`);
            }
        }
        
        if (projectId) {
            createNavigation(projectId, 'timeline');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/minified/intro.min.js"></script>
    <script type="module" src="js/timeline.js"></script>
</body>
</html>
