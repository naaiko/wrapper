<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Intro.js for Onboarding -->
    <link href="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/minified/introjs.min.css" rel="stylesheet" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/intro-custom.css">
    <link rel="stylesheet" href="css/edit-screen.css">
    <link rel="stylesheet" href="css/release-calendar.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Fountain.js for script parsing (local) -->
    <script src="js/libs/fountain.js"></script>
    
    <!-- Import Map for ES Modules -->
    <script type="importmap">
    {
        "imports": {
            "sortablejs": "https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/modular/sortable.esm.js"
        }
    }
    </script>
</head>
<body class="overflow-hidden">
    <div class="min-h-screen bg-base-200">
        <!-- Navigation (Top Right) -->
        <div class="fixed top-4 right-4 z-50" id="topNavigation">
            <!-- Navigation will be injected here by navigation.js -->
        </div>

        <!-- Main Content -->
        <div class="flex flex-col h-screen">
            <!-- Timeline Container (Full Viewport) -->
            <div class="flex-1 px-4 pt-20 pb-16 flex flex-col items-center justify-center overflow-hidden">
                <div class="flex flex-col w-full">
                    <!-- Horizontal Scrollable Timeline -->
                    <div id="sceneContainer" class="flex items-end overflow-x-auto gap-4 pb-4 scrollbar-hide">
                        <!-- Scenes will be dynamically inserted here -->
                    </div>
                    
                    <!-- Timeline Minimap (Overview) - Naturally positioned below cards -->
                    <div class="flex justify-center items-center gap-4 py-4">
                        <!-- Zoom Info -->
                        <div class="flex items-center gap-2">
                            <span id="zoomLevel" class="text-xs text-base-content/60 w-12 text-center">100%</span>
                            <button id="zoomReset" class="btn btn-xs btn-ghost" title="Reset Zoom">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                                </svg>
                            </button>
                        </div>
                        
                        <!-- Minimap -->
                        <div class="w-full max-w-[800px] px-4">
                            <div id="timelineMinimap" class="relative h-3 bg-base-300/50 rounded-full overflow-hidden">
                                <!-- Minimap scenes -->
                                <div id="minimapScenes" class="absolute inset-0"></div>
                                <!-- Viewport indicator with resize handles -->
                                <div id="minimapViewport" class="absolute top-0 bottom-0 bg-primary/40 border border-primary rounded-full cursor-pointer group">
                                    <!-- Left resize handle -->
                                    <div class="absolute left-0 top-0 bottom-0 w-2 cursor-ew-resize hover:bg-primary/60" data-resize="left"></div>
                                    <!-- Right resize handle -->
                                    <div class="absolute right-0 top-0 bottom-0 w-2 cursor-ew-resize hover:bg-primary/60" data-resize="right"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Dock (Actions) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="flex gap-3 bg-base-100 p-3 rounded-box shadow-xl items-center">
                <!-- Mode Toggle (Compact) -->
                <div class="btn-group btn-group-sm">
                    <button 
                        id="btnStoryOrder" 
                        class="btn btn-sm btn-active"
                        onclick="switchMode('story')"
                        title="Story Order"
                    >
                        Story
                    </button>
                    <button 
                        id="btnShootingOrder" 
                        class="btn btn-sm"
                        onclick="switchMode('shooting')"
                        title="Shooting Order"
                    >
                        Shooting
                    </button>
                </div>
                
                <!-- Divider -->
                <div class="divider divider-horizontal mx-0"></div>
                
                <!-- Import Script Button -->
                <button id="importScriptBtn" class="btn btn-sm bg-base-300/50 hover:bg-base-300 border-none" title="Import Script">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    Import
                </button>
                
                <!-- Locations Config Button -->
                <button id="locationsConfigBtn" class="btn btn-square btn-sm" title="Manage Locations">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                
                <!-- Actors Config Button -->
                <button id="castMembersConfigBtn" class="btn btn-square btn-sm" title="Manage Actors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                </button>
                
                <!-- Add Scene Button -->
                <button id="addSceneBtn" class="btn btn-square btn-primary btn-sm" title="Add Scene">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Scene Screen is now dynamically created by AddSceneScreen component -->

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script type="module">
        import { createNavigation } from './js/components/navigation.js';
        
        // Initialize navigation
        const urlParams = new URLSearchParams(window.location.search);
        let projectId = urlParams.get('project');
        
        // Fallback to localStorage if no project in URL
        if (!projectId) {
            projectId = localStorage.getItem('continuityManager_currentProject');
            if (projectId) {
                // Update URL with project ID
                window.history.replaceState({}, '', `?project=${projectId}`);
            }
        }
        
        if (projectId) {
            createNavigation(projectId, 'timeline');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/intro.js@7.2.0/minified/intro.min.js"></script>
    <script type="module" src="js/timeline.js"></script>
    
    <!-- Version Badge -->
    <div id="versionBadge"></div>
    <script type="module">
        import { version } from './js/version.js';
        document.getElementById('versionBadge').innerHTML = version.badge();
    </script>
</body>
</html>
