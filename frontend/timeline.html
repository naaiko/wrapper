<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="css/timeline.css">
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="overflow-hidden">
    <div class="min-h-screen bg-base-200">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-lg">
            <div class="flex-1">
                <a href="projects.html" class="btn btn-ghost text-xl">Continuity Manager</a>
            </div>
            <div class="flex-none">
                <a href="projects.html" class="btn btn-ghost">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Projects
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex flex-col h-[calc(100vh-4rem-4rem)]">
            <!-- Mode Toggle -->
            <div class="flex justify-center py-6 bg-base-200">
                <div class="btn-group">
                    <button 
                        id="btnStoryOrder" 
                        class="btn btn-active"
                        onclick="switchMode('story')"
                    >
                        Story Order
                    </button>
                    <button 
                        id="btnShootingOrder" 
                        class="btn"
                        onclick="switchMode('shooting')"
                    >
                        Shooting Order
                    </button>
                </div>
            </div>

            <!-- Timeline Container (Full Viewport) -->
            <div class="flex-1 px-4">
                <h2 class="text-2xl font-bold mb-4" id="timelineTitle">Story Timeline</h2>
                
                <!-- Horizontal Scrollable Timeline -->
                <div id="sceneContainer" class="flex items-center overflow-x-auto gap-4 pb-4 h-[calc(100%-3rem)] scrollbar-hide">
                    <!-- Scenes will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Bottom Dock (Actions) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="flex gap-2 bg-base-100 p-3 rounded-box shadow-xl">
                <button class="btn btn-square btn-primary" onclick="showAddSceneModal()" title="Add Scene">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Add Scene Modal -->
    <dialog id="addSceneModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Add New Scene</h3>
            <form id="addSceneForm" onsubmit="addScene(event)">
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Scene Number</span>
                    </label>
                    <input 
                        type="text" 
                        id="sceneNumber" 
                        class="input input-bordered" 
                        placeholder="e.g., 1, 2A, 15B" 
                        required 
                    />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Description</span>
                    </label>
                    <input 
                        type="text" 
                        id="sceneDescription" 
                        class="input input-bordered" 
                        placeholder="e.g., INT. COFFEE SHOP - DAY" 
                        required 
                    />
                </div>
                
                <div class="form-control mb-4">
                    <label class="label">
                        <span class="label-text">Shooting Days (comma separated)</span>
                    </label>
                    <input 
                        type="text" 
                        id="sceneShootingDays" 
                        class="input input-bordered" 
                        placeholder="e.g., 1,3,5" 
                        required 
                    />
                    <label class="label">
                        <span class="label-text-alt">Enter day numbers separated by commas</span>
                    </label>
                </div>
                
                <div class="modal-action">
                    <button type="button" class="btn" onclick="document.getElementById('addSceneModal').close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Scene</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script src="js/timeline.js"></script>
</body>
</html>
