<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Continuity Manager</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="min-h-screen bg-base-200">
        <!-- Navbar -->
        <div class="navbar bg-base-100 shadow-lg">
            <div class="flex-1">
                <a href="index.html" class="btn btn-ghost text-xl">Continuity Manager</a>
                <div class="breadcrumbs text-sm ml-4">
                    <ul>
                        <li><a href="index.html">Projects</a></li>
                        <li>User Management</li>
                    </ul>
                </div>
            </div>
            <div class="flex-none" id="userDisplay">
                <!-- User info will be populated by JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="container mx-auto p-6">
            <div class="mb-6 flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold mb-2">User Management</h1>
                    <p class="text-base-content/70">Manage users and their access to projects</p>
                </div>
                <div class="flex gap-2">
                    <a href="onboarding-admin.html" class="btn btn-outline">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Onboarding
                    </a>
                    <button onclick="showCreateUserModal()" class="btn btn-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Create User
                    </button>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <div class="overflow-x-auto">
                        <table class="table table-zebra">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Status</th>
                                    <th>Projects</th>
                                    <th>Last Login</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="usersTableBody">
                                <!-- Will be populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create User Modal -->
    <dialog id="createUserModal" class="modal">
        <div class="modal-box">
            <h3 class="font-bold text-lg mb-4">Create New User</h3>
            <form id="createUserForm">
                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">Name</span>
                    </label>
                    <input type="text" id="userName" placeholder="Full name" class="input input-bordered w-full" required />
                </div>

                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">Email</span>
                    </label>
                    <input type="email" id="userEmail" placeholder="email@example.com" class="input input-bordered w-full" required />
                </div>

                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">Password</span>
                    </label>
                    <input type="password" id="userPassword" placeholder="Temporary password" class="input input-bordered w-full" required />
                    <label class="label">
                        <span class="label-text-alt">User can change this after first login</span>
                    </label>
                </div>

                <div class="form-control w-full mb-4">
                    <label class="label">
                        <span class="label-text">Role</span>
                    </label>
                    <select id="userRole" class="select select-bordered w-full" required>
                        <option value="">Select role...</option>
                        <option value="manager">Manager</option>
                        <option value="superadmin">Superadmin</option>
                    </select>
                    <label class="label">
                        <span class="label-text-alt">Managers see only their projects, superadmins see everything</span>
                    </label>
                </div>

                <div class="modal-action">
                    <button type="button" class="btn" onclick="document.getElementById('createUserModal').close()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>

    <!-- Application Scripts -->
    <script src="js/supabase-config.js"></script>
    <script type="module">
        import authService from './js/services/authService.js';
        import userService from './js/services/userService.js';
        import projectService from './js/services/projectService.js';

        // Check authentication and superadmin role
        if (!authService.requireAuth()) {
            window.location.href = 'login.html';
        }
        if (!authService.isSuperAdmin()) {
            alert('Access denied: Superadmin role required');
            window.location.href = 'index.html';
        }

        // Display current user
        const currentUser = authService.getCurrentUser();
        document.getElementById('userDisplay').innerHTML = `
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="font-semibold">${currentUser.name}</p>
                    <p class="text-xs text-base-content/60">${currentUser.role}</p>
                </div>
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost btn-circle avatar placeholder">
                        <div class="bg-primary text-primary-content rounded-full w-10">
                            <span class="text-lg">${currentUser.name.charAt(0).toUpperCase()}</span>
                        </div>
                    </label>
                    <ul tabindex="0" class="mt-3 z-[1] p-2 shadow menu menu-sm dropdown-content bg-base-100 rounded-box w-52">
                        <li><a href="index.html">Projects</a></li>
                        <li><a href="onboarding-admin.html">Onboarding Admin</a></li>
                        <li><a onclick="authService.logout()">Logout</a></li>
                    </ul>
                </div>
            </div>
        `;

        // Load users
        async function loadUsers() {
            try {
                const users = await userService.getAllUsers();
                const tbody = document.getElementById('usersTableBody');

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-base-content/50">No users found</td></tr>';
                    return;
                }

                tbody.innerHTML = await Promise.all(users.map(async user => {
                    let projectCount = 0;
                    if (user.role === 'manager') {
                        const projects = await projectService.getProjectsByManager(user.id);
                        projectCount = projects.length;
                    }

                    const lastLogin = user.last_login 
                        ? new Date(user.last_login).toLocaleString()
                        : 'Never';

                    const statusBadge = user.is_active 
                        ? '<span class="badge badge-success badge-sm">Active</span>'
                        : '<span class="badge badge-error badge-sm">Inactive</span>';

                    const roleBadge = user.role === 'superadmin'
                        ? '<span class="badge badge-primary">Superadmin</span>'
                        : '<span class="badge badge-secondary">Manager</span>';

                    const canDelete = user.id !== currentUser.id;

                    return `
                        <tr>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${roleBadge}</td>
                            <td>${statusBadge}</td>
                            <td>${user.role === 'manager' ? projectCount : 'All'}</td>
                            <td class="text-sm text-base-content/60">${lastLogin}</td>
                            <td>
                                <div class="flex gap-2">
                                    ${canDelete ? `
                                        <button onclick="deleteUser('${user.id}', '${user.name}')" class="btn btn-ghost btn-xs">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    ` : '<span class="text-xs text-base-content/40">You</span>'}
                                </div>
                            </td>
                        </tr>
                    `;
                })).then(rows => rows.join(''));
            } catch (error) {
                console.error('Error loading users:', error);
                alert('Failed to load users');
            }
        }

        // Create user
        window.showCreateUserModal = function() {
            document.getElementById('createUserForm').reset();
            document.getElementById('createUserModal').showModal();
        };

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const userData = {
                name: document.getElementById('userName').value.trim(),
                email: document.getElementById('userEmail').value.trim(),
                password: document.getElementById('userPassword').value,
                role: document.getElementById('userRole').value
            };

            try {
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span class="loading loading-spinner"></span> Creating...';

                await userService.createUser(userData);
                
                document.getElementById('createUserModal').close();
                await loadUsers();

                showNotification('User created successfully', 'success');
            } catch (error) {
                console.error('Error creating user:', error);
                alert('Failed to create user: ' + error.message);
            } finally {
                const submitBtn = e.target.querySelector('button[type="submit"]');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create User';
            }
        });

        // Delete user
        window.deleteUser = async function(userId, userName) {
            if (!confirm(`Are you sure you want to delete user "${userName}"? This cannot be undone.`)) {
                return;
            }

            try {
                await userService.deleteUser(userId);
                await loadUsers();
                showNotification('User deleted successfully', 'success');
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Failed to delete user: ' + error.message);
            }
        };

        // Notification toast
        function showNotification(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `alert alert-${type} fixed bottom-4 right-4 w-auto z-50`;
            toast.innerHTML = `<span>${message}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), 3000);
        }

        // Initialize
        window.authService = authService;
        loadUsers();
    </script>
</body>
</html>
