    <div class="min-h-screen bg-base-200 h-screen overflow-hidden">
        <!-- Navigation (Top Right) -->
        <div class="fixed top-4 right-4 z-50" id="topNavigation">
            <!-- Navigation will be injected here by navigation.js -->
        </div>

        <!-- Main Content Container: fits between navigation and dock -->
        <div class="h-screen pt-20 pb-20 px-4">
            <div class="grid grid-cols-12 gap-6 h-full">
                <!-- Left Column (4 cols) - Cast Member Details -->
                <div class="col-span-4 bg-base-100 rounded-lg p-6 overflow-y-auto h-full">
                    <div id="castMemberDetailsPanel">
                        <!-- Cast Member Details will be rendered here -->
                        <div class="flex flex-col gap-4">
                            <div class="skeleton h-6 w-full"></div>
                            <div class="skeleton h-6 w-3/4"></div>
                            <div class="skeleton h-32 w-full"></div>
                        </div>
                    </div>
                </div>

                <!-- Middle Column (4 cols) - Silhouette + Toggle -->
                <div class="col-span-4 flex flex-col gap-4 h-full min-h-0">
                    <!-- Silhouette container - takes all available space -->
                    <div class="flex-1 min-h-0 flex items-end justify-center">
                        <svg class="cast-member-silhouette mode-bodyshots" viewBox="0 0 373 852" role="img" aria-label="Cast member silhouette with layers">
                            <!-- Layers loaded from images/silhouette.svg on page load -->
                        </svg>
                    </div>
                    
                    <!-- Mode Toggle - fixed height at bottom of column -->
                    <div class="flex-shrink-0 flex justify-center" role="tablist">
                        <div class="tabs tabs-boxed bg-base-100 shadow-md">
                            <button role="tab" class="tab tab-active layer-mode-btn" data-mode="bodyshots">Bodyshots</button>
                            <button role="tab" class="tab layer-mode-btn" data-mode="accessories">Accessories</button>
                            <button role="tab" class="tab layer-mode-btn" data-mode="outfit">Outfit</button>
                        </div>
                    </div>
                </div>

                <!-- Right Column (4 cols) - Calendar -->
                <div class="col-span-4 bg-base-100 rounded-lg p-6 flex flex-col h-full min-h-0">
                    <div class="flex-shrink-0 flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Scenes Calendar</h3>
                        <div class="flex items-center gap-2">
                            <button id="castMemberCalendarPrevMonth" class="btn btn-ghost btn-sm btn-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                                </svg>
                            </button>
                            <span id="castMemberCalendarMonth" class="text-sm font-semibold min-w-[120px] text-center"></span>
                            <button id="castMemberCalendarNextMonth" class="btn btn-ghost btn-sm btn-circle">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div id="castMemberCalendar" class="flex-1 min-h-0 overflow-hidden">
                        <!-- Toast UI Calendar will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Dock (Bottom Center) -->
        <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 z-50">
            <div class="bg-base-100 shadow-2xl rounded-2xl px-4 py-2 flex items-center gap-2">
                <!-- Grid/Detail Toggle -->
                <button id="toggleViewBtn" class="btn btn-ghost btn-sm btn-circle" aria-label="Toggle Grid/Detail" title="Back to Grid">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                    </svg>
                </button>
                
                <div class="divider divider-horizontal mx-0"></div>
                
                <!-- Previous cast member Button -->
                <button id="btnPrevCastMember" class="btn btn-ghost btn-sm btn-circle" aria-label="Previous cast member">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>
                
                <!-- Actor Name Display -->
                <div class="px-4">
                    <h1 id="castMemberNameTitle" class="text-sm font-semibold whitespace-nowrap">
                        <div class="skeleton h-5 w-32"></div>
                    </h1>
                </div>
                
                <!-- Next cast member Button -->
                <button id="btnNextCastMember" class="btn btn-ghost btn-sm btn-circle" aria-label="Next cast member">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Confirmation Dialog (reusable) -->
    <dialog id="confirmDialog" class="modal">
        <div class="modal-box">
            <h3 id="confirmTitle" class="font-bold text-lg"></h3>
            <p id="confirmMessage" class="py-4"></p>
            <div class="modal-action">
                <button id="confirmCancel" class="btn btn-ghost"></button>
                <button id="confirmOk" class="btn btn-error"></button>
            </div>
        </div>
        <div id="confirmBackdrop" class="modal-backdrop"></div>
    </dialog>

    <!-- Supabase Configuration -->
    <script src="js/supabase-config.js"></script>

    <!-- Navigation Script -->
    <script type="module">
        import { createNavigation } from './js/components/navigation.js';
        
        const urlParams = new URLSearchParams(window.location.search);
        let projectId = urlParams.get('project');
        
        if (!projectId) {
            projectId = localStorage.getItem('continuityManager_currentProject');
            if (projectId) {
                const actor = urlParams.get('actor');
                const params = new URLSearchParams({ project: projectId });
                if (actor) params.append('actor', actor);
                window.history.replaceState({}, '', `?${params.toString()}`);
            }
        }
        
        if (projectId) {
            createNavigation(projectId, 'cast');
        }
    </script>
    
    <!-- Version Badge -->
    <div id="versionBadge"></div>
    <script type="module">
        import { version } from './js/version.js';
        document.getElementById('versionBadge').innerHTML = version.badge();
    </script>
    
    <!-- Main Application -->
    <script type="module" src="js/cast-detail.js"></script>
</body>
</html>
